# Entity types and registry of the batiment pack. Every name comes from
# samples/fiction/bible.yaml. Entity-type titles are plural display titles.
#
# Aliases drive deterministic mentions in the French documents (`fr`) and gather the English
# facts of the compiled wiki on entity pages (`en`); they also expand search queries. Matching
# ignores case and accents (not the "œ" ligature: both spellings are listed) and needs whole
# words. Window marks shorter than three characters (F1, F2) only match inside longer aliases.
#
# Since slice F (ADR 0011) the `chantier` type describes each scope value of scopes.yaml (its key
# is the chantier code, its attributes feed the hub page); subcontractors and the maître d'œuvre
# have their own types, apart from the other organisations (so Adatum's id is
# sous-traitant:adatum-electricite). Work packages are the lots of the Moreau quote: their aliases
# name the lot titles only, never a bare "lot N", which every chantier uses. The commercial
# documents stay one type (contractual and purchasing documents together): splitting it would
# change the ids of the existing entries.
types:
  # The hub page shows the attributes labelled here, in this order. `phase` is shown with its
  # title from scopes.yaml ("3 Exécution"), so `phase_title` has no label and is not shown.
  - key: chantier
    title: Chantiers
    description: "The company's chantiers: client, contract type, phase, maître d'œuvre and conducteur de travaux of each one."
    attribute_labels:
      code: Code
      phase: Phase
      contract_type: Contract type
      client: Client
      maitre_d_oeuvre: "Maître d'œuvre"
      conducteur: Conducteur de travaux
      address: Address
      object: Works
  - {key: organisation, title: Organisations, description: "The contractor, its clients and its suppliers."}
  - {key: sous-traitant, title: Sous-traitants, description: "Subcontractors of the company, with the chantiers they work on."}
  - {key: maitre-d-oeuvre, title: Maîtres d'œuvre, description: "Architects and designers who direct the works for a maître d'ouvrage."}
  - {key: person, title: People, description: "People named in the company files, with their organisation and role."}
  - {key: work-package, title: Work packages, description: "The lots of the Moreau quote, which structure its prices, its schedule and who does the work."}
  - {key: building-element, title: Building elements, description: "Parts of the buildings that the documents follow individually: openings, windows, doors and the slab."}
  - {key: material, title: Materials, description: "Articles supplied by the builders' merchant, with their article codes and framework prices."}
  - {key: materiel, title: Matériel, description: "The company's equipment, with its assignment and its periodic inspections."}
  - {key: reserve, title: Réserves, description: "The réserves recorded at a réception, with their lifting status."}
  - {key: situation, title: Situations, description: "Progress payment applications (situations) of the chantiers and of the subcontractors."}
  - {key: commercial-document, title: Commercial documents, description: "Quotes and DPGF, contracts, amendments and service orders, schedules, purchase orders, supplier and client invoices and delivery notes, as other documents cite them."}

