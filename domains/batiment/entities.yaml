# Entity types and registry of the batiment pack. Every name comes from
# samples/fiction/bible.yaml. Entity-type titles are plural display titles.
#
# Aliases drive deterministic mentions in the French documents (`fr`) and gather the English
# facts of the compiled wiki on entity pages (`en`); they also expand search queries. Matching
# ignores case and accents (not the "œ" ligature: both spellings are listed) and needs whole
# words. Window marks shorter than three characters (F1, F2) only match inside longer aliases.
types:
  - {key: organisation, title: Organisations, description: "The contractor, the client household and the third parties of the job."}
  - {key: person, title: People, description: "People named in the job file, with their organisation and role."}
  - {key: work-package, title: Work packages, description: "The lots of the quote, which structure prices, the schedule and who does the work."}
  - {key: building-element, title: Building elements, description: "Parts of the building that the documents follow individually: openings, windows and the slab."}
  - {key: material, title: Materials, description: "Articles supplied by the builders' merchant, with their article codes."}
  - {key: commercial-document, title: Commercial documents, description: "The quote, the works contract and its amendment, the schedule, purchase orders, invoices and delivery notes, as other documents cite them."}

