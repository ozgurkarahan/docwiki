# Contradiction resolution policy, stated on topic pages next to both claims (never applied
# silently). Authorities are those of taxonomy.yaml; the doc type keys below are its keys.
# The reasons and the notes are shown on the pages: they are written in the wiki's canonical
# language (French); the translate stage gives the English mirror its translation.
order: [authority, recency]
# An amendment (avenant) or an ordre de service changes the terms of the contract of its
# chantier: a disagreement between them is a change, shown as "changed by", not a contradiction;
# and when the rule would let the contract win against another document, the page says that the
# contract's term may have been changed by the amending documents of that chantier (to review).
amendments:
  - amending: [contract-amendment, ordre-de-service]
    amended: [works-contract, acte-d-engagement, ccap]
# A later report of the same chantier tells what happened since an earlier document (a delivery
# postponed, a date moved, a réserve recorded or lifted): a disagreement between them is an
# update shown with both dates, never a contest of authority (an older OS does not outrank the
# supplier's e-mail announcing a delay). Schedules are not reports: a schedule that disagrees
# with the site meeting minutes stays a contradiction.
updates:
  - earlier:
      - ordre-de-service
      - contract-amendment
      - schedule
      - crew-schedule
      - purchase-order
      - site-meeting-minutes
      - liste-des-reserves
      - pv-de-reception
      - supplier-email
    later: [supplier-email, site-meeting-minutes, liste-des-reserves, pv-de-reception, delivery-note]
# Pairs the authority rule does not decide: the point is arbitrated with the client.
arbitrate:
  - types: [client-email, schedule]
    reason: >-
      Une contrainte écrite du client sur son propre bâtiment ou ses locaux est une demande que le
      planning doit prendre en compte, pas une affirmation que le planning écarte : arbitrer le
      point avec le client (et le confirmer par un ordre de service ou un avenant s'il modifie le
      marché).
  - types: [client-email, crew-schedule]
    reason: >-
      Une contrainte écrite du client sur son propre bâtiment ou ses locaux est une demande que le
      planning des équipes doit prendre en compte, pas une affirmation qu'il écarte : arbitrer le
      point avec le client.
  # The PPSPS is our own safety plan: it organises the works and their phasing on the client's
  # premises, so a client's constraint against it is arbitrated too. Contracts, avenants and
  # ordres de service are not paired: the client signs them.
  - types: [client-email, ppsps]
    reason: >-
      Une contrainte écrite du client sur son propre bâtiment ou ses locaux (occupation, accès ou
      horaires) est une demande que le PPSPS et son phasage doivent prendre en compte, pas une
      affirmation que notre propre plan de sécurité écarte : arbitrer le point avec le client et le
      coordonnateur SPS, puis mettre à jour le PPSPS.
notes: >-
  Les actes signés qui modifient ou clôturent le marché l'emportent : avenant, ordre de service ou
  PV de réception (rang 10) sur le marché auquel ils se rapportent (marché de travaux, acte
  d'engagement, CCAP ou contrat-cadre, rang 9), et le marché sur le devis, la DPGF ou un document
  de sous-traitance (rang 8). Un avenant ou un ordre de service qui modifie une clause du marché de
  son chantier (une date, un montant, l'objet des travaux) est une modification, pas une
  contradiction ; une clause du marché se vérifie contre les avenants et ordres de service du
  chantier avant d'être retenue. Les comptes rendus de chantier signés, la liste des réserves et
  les conditions générales (rang 7) l'emportent sur un bon de livraison et ses mentions
  manuscrites, une situation, le suivi de facturation et le tarif (rang 6) ; le bon de livraison
  l'emporte sur la facture fournisseur (rang 5) pour les quantités réellement livrées, comme les
  bons de commande, le PPSPS et les registres de l'entreprise à ce rang. Les plannings, le planning
  des équipes et les courriels des fournisseurs ont le même rang (4) : l'information la plus
  récente l'emporte jusqu'à ce qu'un nouvel indice du planning remplace l'ancien. Un document plus
  récent du chantier qui rapporte ce qui s'est passé depuis (une livraison reportée, une date
  décalée, une réserve levée) met à jour le document plus ancien : c'est une mise à jour datée, pas
  une contradiction tranchée par le rang. Les courriels des clients, les études de prix et les
  tableaux de bord des marges (rang 3) sont des demandes ou des estimations internes ; un avenant
  rend une demande contractuelle. Une contrainte écrite du client (un courriel) opposée à notre
  planning, au planning des équipes ou au PPSPS n'est jamais tranchée par la règle : elle est
  arbitrée avec le client. Les photos de chantier et l'organigramme (rang 2) ne tranchent jamais
  une quantité ni une date.
