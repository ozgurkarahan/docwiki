# Contradiction resolution policy, stated on topic pages next to both claims (never applied
# silently). Authorities are those of taxonomy.yaml.
order: [authority, recency]
notes: >-
  Signed acts that change or close a contract prevail: an amendment (avenant), an ordre de
  service or a PV de réception (authority 10) over the contract they relate to (works contract,
  acte d'engagement, CCAP or framework contract, 9), and a contract over the priced offer, the
  DPGF or a subcontracting document (8). Signed site meeting minutes, the réserves list and the
  general terms (7) prevail over a delivery note with its handwritten reserves, a situation, the
  billing register and the price list (6); a delivery note prevails over the supplier invoice (5)
  for the quantities actually delivered, as do purchase orders, the PPSPS and the company
  registers at that level. Schedules (planning), the crew schedule and the suppliers' e-mails
  have the same authority (4): the more recent statement prevails until a new schedule revision
  (indice) supersedes the old one. Client e-mails, price studies and margin dashboards (3) are
  requests or internal estimates; an amendment makes a request binding. Site photos and the
  organisation chart (2) never settle a quantity or a date.
