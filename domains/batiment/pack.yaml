# Domain pack: the company files of a small general contractor (fictional public sample).
# The names of the sample world come from samples/fiction/bible.yaml; this pack repeats them only
# in the banner below and in the registry of entities.yaml.
name: batiment
title: Building works - a general contractor's company files
description: >-
  The files of a small French general contractor running several chantiers at different phases
  and under different contract types (a private household, a copropriété with an architect as
  maître d'œuvre, a public client): quotes and DPGF with their revisions, works contracts,
  amendments and service orders, subcontracts, schedules, purchase orders, supplier invoices and
  delivery notes, situations, site meeting minutes, PV de réception and réserves, e-mails, site
  photos, and company documents (framework contract and price list, crew schedule, equipment and
  attestation registers, billing register, general terms). The documents are in French.
default_audience: public
languages: [fr, en]
wiki_title: Lamna Bâtiment
fictional: true
banner: >-
  FICTIONAL SAMPLE - Lamna Bâtiment, its chantiers (the Moreau household, the résidence Les
  Nacrines, the école de Montferrine), Valbrise, Montferrine and every organisation, person,
  product, amount and date in this wiki are invented. Not for operational use.
