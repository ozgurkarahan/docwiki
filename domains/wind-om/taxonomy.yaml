# Document taxonomy of the wind-om pack. A filename_regex is matched against the file name, a
# text_regex against the first `first_chars` characters of the extracted text. Every sample file
# matches a filename rule; text rules are specific to the title line of their document type.
categories:
  - {key: oem-documentation, title: "OEM documentation", description: "Manufacturer manuals and service bulletins."}
  - {key: procedures, title: "Procedures", description: "Standard operating procedures, work instructions and single-point lessons."}
  - {key: incidents, title: "Incidents", description: "Incident investigations and near-miss reports."}
  - {key: change-management, title: "Change management", description: "Management-of-change records."}
  - {key: records-and-data, title: "Records and data", description: "Asset register, maintenance plan, stock lists and data exports."}
  - {key: lab-and-inspection, title: "Laboratory and inspection", description: "Oil analysis, blade inspection and lift plans."}
  - {key: compliance, title: "Compliance", description: "Permits, grid operator instructions and audits."}
  - {key: training, title: "Training", description: "Training and induction material."}
  - {key: correspondence, title: "Correspondence", description: "E-mail exchanges with suppliers and colleagues."}
  - {key: field-capture, title: "Field capture", description: "Shift notes, supplier notes, checklists, photos and plans."}
  - {key: meetings, title: "Meetings", description: "Meeting minutes and toolbox talk transcripts."}
  - {key: commercial, title: "Commercial", description: "Contracts and rates (restricted)."}

doc_types:
  - key: maintenance-manual
    title: Maintenance manual
    category: oem-documentation
    authority: 8
    rules:
      - {filename_regex: '^LWS-MM-[A-Z]{3}-\d{2}'}
      - {text_regex: '(?i)wind turbine - maintenance manual', first_chars: 2000}
  - key: service-bulletin
    title: Service bulletin
    category: oem-documentation
    authority: 9
    rules:
      - {filename_regex: '^SB-LWS-\d{4}-\d{2}'}
      - {text_regex: 'SB-LWS-\d{4}-\d{2} Rev\. [A-H] - ', first_chars: 2000}
  - key: sop
    title: Standard operating procedure
    category: procedures
    authority: 7
    rules:
      - {filename_regex: '^SOP-[A-Z]{3,4}-\d{3}'}
      - {text_regex: '(?i)standard operating procedure - revision [A-H]', first_chars: 2000}
  - key: work-instruction
    title: Work instruction
    category: procedures
    authority: 7
    rules:
      - {filename_regex: '^WI-[A-Z]{3}-\d{3}'}
      - {text_regex: "(?i)instruction de travail - r\u00e9vision [A-H]|work instruction - revision [A-H]", first_chars: 2000}
  - key: single-point-lesson
    title: Single-point lesson
    category: procedures
    authority: 6
    rules:
      - {filename_regex: '^SPL-\d{3}'}
      - {text_regex: '(?i)single-point lesson - ', first_chars: 2000}
  - key: incident-report
    title: Incident report (8D)
    category: incidents
    authority: 6
    rules:
      - {filename_regex: '^INC-\d{4}-\d{3}_8D'}
      - {text_regex: '(?i)\b8D report INC-\d{4}-\d{3}', first_chars: 2000}
  - key: near-miss-report
    title: Near-miss report
    category: incidents
    authority: 6
    rules:
      - {filename_regex: '^INC-\d{4}-\d{3}_near-miss'}
      - {text_regex: '(?i)near-miss report INC-\d{4}-\d{3}', first_chars: 2000}
  - key: moc-record
    title: Management-of-change record
    category: change-management
    authority: 8
    rules:
      - {filename_regex: '^MOC-\d{4}-\d{3}'}
      - {text_regex: '(?i)management of change record', first_chars: 2000}
  - key: asset-register
    title: Asset register
    category: records-and-data
    authority: 6
    rules:
      - {filename_regex: '^asset-register'}
  - key: maintenance-plan
    title: Maintenance plan
    category: records-and-data
    authority: 6
    rules:
      - {filename_regex: '^maintenance-plan'}
  - key: stock-list
    title: Spare parts stock list
    category: records-and-data
    authority: 5
    rules:
      - {filename_regex: '^spare-parts-stock'}
  - key: scada-log
    title: SCADA alarm and status log
    category: records-and-data
    authority: 5
    rules:
      - {filename_regex: '^scada-alarm-log'}
  - key: work-order-export
    title: Work-order export
    category: records-and-data
    authority: 5
    rules:
      - {filename_regex: '^work-orders-export'}
  - key: trend-data
    title: Condition monitoring trend
    category: records-and-data
    authority: 5
    rules:
      - {filename_regex: '^vibration-trend'}
  - key: kpi-export
    title: KPI export
    category: records-and-data
    authority: 4
    rules:
      - {filename_regex: '^kpi-export'}
  - key: oil-analysis-report
    title: Oil analysis report
    category: lab-and-inspection
    authority: 7
    rules:
      - {filename_regex: '^TR-OA-\d{4}-\d{4}'}
      - {text_regex: '(?i)oil analysis report TR-OA-\d{4}-\d{4}', first_chars: 2000}
  - key: inspection-report
    title: Blade inspection report
    category: lab-and-inspection
    authority: 7
    rules:
      - {filename_regex: '^WBS-\d{4}-\d{3}'}
      - {text_regex: '(?i)blade inspection report WBS-\d{4}-\d{3}', first_chars: 2000}
  - key: lift-plan
    title: Lift plan
    category: lab-and-inspection
    authority: 7
    rules:
      - {filename_regex: '^LP-\d{4}-\d{3}'}
      - {text_regex: '(?i)lift plan\s+LP-\d{4}-\d{3}', first_chars: 2000}
  - key: environmental-permit
    title: Environmental permit
    category: compliance
    authority: 10
    rules:
      - {filename_regex: '^EP-\d{4}-\d{4}'}
      - {text_regex: '(?i)environmental permit EP-\d{4}-\d{4} - ', first_chars: 2000}
  - key: grid-instruction
    title: Grid operator instruction
    category: compliance
    authority: 9
    rules:
      - {filename_regex: '^CPL-CI-\d{4}-\d{3}'}
      - {text_regex: '(?i)curtailment instruction CPL-CI-\d{4}-\d{3}', first_chars: 2000}
  - key: audit-report
    title: Audit report
    category: compliance
    authority: 6
    rules:
      - {filename_regex: '^AUD-\d{4}-\d{2}'}
      - {text_regex: '(?i)internal safety audit report AUD-\d{4}-\d{2}', first_chars: 2000}
  - key: training-deck
    title: Training deck
    category: training
    authority: 4
    rules:
      - {filename_regex: '(?i)(onboarding|fundamentals).*\.pptx$'}
  - key: email
    title: E-mail
    category: correspondence
    authority: 3
    rules:
      - {filename_regex: '(?i)\.eml$'}
  - key: checklist
    title: Field checklist
    category: field-capture
    authority: 3
    rules:
      - {filename_regex: '^CHK-\d{2}'}
      - {filename_regex: '(?i)checklist'}
  - key: site-plan
    title: Site plan
    category: field-capture
    authority: 4
    rules:
      - {filename_regex: '(?i)site-layout-plan'}
  - key: shift-note
    title: Shift handover note
    category: field-capture
    authority: 2
    rules:
      - {filename_regex: '(?i)shift-handover|note-de-releve'}
  - key: supplier-note
    title: Supplier note
    category: field-capture
    authority: 3
    rules:
      - {filename_regex: '(?i)lieferantenhinweis|supplier-note'}
  - key: meeting-transcript
    title: Meeting transcript
    category: meetings
    authority: 2
    rules:
      - {filename_regex: '(?i)\.vtt$'}
  - key: meeting-minutes
    title: Meeting minutes
    category: meetings
    authority: 4
    rules:
      - {filename_regex: '(?i)minutes'}
  - key: rate-card
    title: Contractor rate card
    category: commercial
    authority: 5
    rules:
      - {filename_regex: '(?i)rate-card'}
