# Document taxonomy of the it-runbooks pack.
categories:
  - {key: operations, title: "Operations", description: "Runbooks, procedures and on-call rules."}
  - {key: learning, title: "Learning from incidents", description: "Postmortems."}
  - {key: inventory, title: "Inventory", description: "Service catalog and ownership."}

doc_types:
  - key: runbook
    title: Runbook
    category: operations
    authority: 7
    rules:
      - {filename_regex: '^RB-[A-Z]{3}-\d{3}'}
      - {text_regex: '(?i)\brunbook - reviewed', first_chars: 2000}
  - key: procedure
    title: Procedure
    category: operations
    authority: 8
    rules:
      - {filename_regex: '^PRC-[A-Z]{2}-\d{3}'}
  - key: handbook
    title: Handbook
    category: operations
    authority: 6
    rules:
      - {filename_regex: '(?i)handbook'}
  - key: postmortem
    title: Postmortem
    category: learning
    authority: 5
    rules:
      - {filename_regex: '^PM-\d{4}-\d{3}'}
      - {text_regex: '(?i)blameless postmortem - \d{4}-\d{2}-\d{2}', first_chars: 2000}
  - key: service-catalog
    title: Service catalog
    category: inventory
    authority: 6
    rules:
      - {filename_regex: '(?i)service-catalog'}
