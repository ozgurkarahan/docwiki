# Glossary seeds of the it-runbooks pack (English only, like the pack).
terms:
  - term: service level objective
    definition: Target level of reliability for a service, for example 99.9 % availability.
    synonyms: {en: [SLO]}
    see_also: [topic:service-reliability]
  - term: recovery point objective
    definition: Maximum amount of data, expressed as time, that may be lost in an incident.
    synonyms: {en: [RPO]}
    see_also: [topic:database-operations]
  - term: recovery time objective
    definition: Maximum time to restore a service after an incident.
    synonyms: {en: [RTO]}
    see_also: [topic:database-operations]
  - term: failover
    definition: Switching a service from a failed primary to a standby.
    synonyms: {en: [switchover, promotion of the standby]}
    see_also: [procedure:prc-db-007]
  - term: postmortem
    definition: Blameless written review of an incident with a timeline, root cause and action items.
    synonyms: {en: [post-incident review]}
    see_also: [topic:service-reliability]
  - term: incident commander
    definition: Person who coordinates the response to a SEV1 or SEV2 incident and takes decisions.
    synonyms: {en: [IC]}
    see_also: [topic:incident-response]
  - term: connection pool
    definition: Set of reusable database connections kept open by an application.
    synonyms: {en: [pool size]}
    see_also: [topic:service-reliability]
