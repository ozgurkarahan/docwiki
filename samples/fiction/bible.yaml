# Identifier patterns of assets, parts and codes (emitted as `re:` lines in allowlist.txt).
identifier_patterns:
  - {name: turbine, regex: 'WTG-\d{2}', examples: [WTG-01, WTG-12]}
  - {name: turbine serial number, regex: 'LT32-\d{2}-\d{4}', examples: [LT32-19-0421]}
  - {name: gearbox serial number, regex: 'FGT-3200-\d{2}-\d{5}', examples: [FGT-3200-18-07752]}
  - {name: blade serial number, regex: 'LB575-\d{2}-\d{4}', examples: [LB575-19-1187]}
