schema: 1

world:
  name: Quellmoor Ridge
  summary: >-
    Contoso Renewables operates and maintains Quellmoor Ridge Wind Farm, a fictional onshore wind
    farm of twelve Litware LT-32 turbines (cold-climate version) in the fictional district of
    Skelvane. The corpus covers operations, maintenance, safety, compliance, supply chain and
    training from January 2025 to September 2026.
  stamp: FICTIONAL - NOT FOR OPERATIONAL USE
  stamp_variants:
    - FICTIONAL - NOT FOR OPERATIONAL USE
    - "FICTIONAL — NOT FOR OPERATIONAL USE"
  timeline_start: "2025-01-01"
  timeline_end: "2026-09-30"
  timezone_note: Local times are written without offset; e-mail headers use +0100 (winter) or +0200 (summer).
  currency: EUR
  generator:
    author: DocWiki sample generator
    last_modified_by: DocWiki sample generator
    seed: 20260917
  email_domains:
    note: >-
      All e-mail addresses use the reserved `.example` top-level domain (RFC 2606) and are not
      routable. No other e-mail domain is used in the samples.
    domains:
      - contoso-renewables.example
      - litware-wind.example
      - fabrikam-getriebe.example
      - trey-research.example
      - relecloud.example

