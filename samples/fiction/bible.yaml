      title: "Cahier des clauses administratives particulières (extrait)"
      procedure: "Marché public de travaux passé selon une procédure adaptée, à lot unique."
      articles:
        - {n: "1", title: "Objet du marché", text: "Le marché porte sur la rénovation énergétique de l'école élémentaire du Bourg, rue de l'École, Montferrine : remplacement des fenêtres, isolation des plafonds des classes, éclairage, rénovation du bloc sanitaire et peinture."}
        - {n: "2", title: "Maître d'ouvrage et maîtrise d'œuvre", text: "Le maître d'ouvrage est la commune de Montferrine, représentée par son maire. La maîtrise d'œuvre est assurée par les services techniques de la commune."}
        - {n: "3", title: "Prix", text: "Le marché est conclu à prix global et forfaitaire, décomposé dans la décomposition du prix global et forfaitaire (DPGF) remise par le titulaire. Les prix sont fermes."}
        - {n: "4", title: "Délais", text: "Une période de préparation de trois mois court à compter de la notification du marché. Les travaux sont exécutés pendant les vacances scolaires d'été, du 06/07/2026 au 28/08/2026. Aucun travail n'est réalisé en présence des élèves."}
        - {n: "5", title: "Pénalités", text: "En cas de retard sur la date d'achèvement, le titulaire encourt, sans mise en demeure préalable, une pénalité de 300,00 € par jour calendaire de retard, dans la limite de 5 % du montant HT du marché. Toute absence à une réunion de chantier est pénalisée de 150,00 € par absence."}
        - {n: "6", title: "Retenue de garantie", text: "Une retenue de garantie de 5 % est prélevée sur le montant de chaque acompte. Elle peut être remplacée par une garantie à première demande."}
        - {n: "7", title: "Règlement des comptes", text: "Une avance de 5 % du montant TTC du marché est versée au titulaire qui ne la refuse pas dans l'acte d'engagement. Les acomptes sont mensuels. Le délai global de paiement est de 30 jours. Les sous-traitants acceptés dont les conditions de paiement ont été agréées sont payés directement par le maître d'ouvrage pour les prestations qu'ils exécutent."}
        - {n: "8", title: "Sécurité et protection de la santé", text: "Le maître d'ouvrage désigne un coordonnateur SPS. Le titulaire remet son plan particulier de sécurité et de protection de la santé (PPSPS) au coordonnateur dans les 30 jours qui suivent la notification du marché. Le dossier technique amiante (DTA) de l'école est tenu à sa disposition en mairie."}
        - {n: "9", title: "Réception", text: "Les opérations préalables à la réception ont lieu au plus tard le 27/08/2026. La réception est prononcée avant la rentrée scolaire du 01/09/2026."}
