  - {prefix: "WI-", pattern: "WI-<AREA>-<NNN> Rev. <A-H>", regex: 'WI-[A-Z]{3}-\d{3}', owner: contoso-renewables, meaning: work instruction, examples: [WI-GEN-014]}
  - {prefix: "SPL-", pattern: "SPL-<NNN>", regex: 'SPL-\d{3}', owner: contoso-renewables, meaning: single-point lesson, examples: [SPL-012]}
