# DocWiki sample world bible - the CLOSED WORLD for every sample document, test and domain pack.
#
# Everything in this file is FICTIONAL. Organisations, people, places, products, article codes,
# document numbers, events and amounts are invented for the DocWiki sample corpus (domain pack
# `batiment`): a small general contractor builds a 30 m2 single-storey house extension and
# renovates the kitchen of one private household in an invented French town, from January to
# April 2026. The documents are written in French; the compiled wiki is written in English.
# Content license: CC BY 4.0 (see LICENSE-CONTENT.md).
#
# Holdout authors: do NOT read the `timeline`, `facts`, `scenarios` and `injection` sections of
# this file, nor samples/fiction/PLANTED.md. They describe the planted answers of the evaluation
# corpus.
#
# Name checks: every organisation, place and person name below, and every article code, was
# web-searched on 2026-10-19 (through the agent web-search tool); products are generic French
# designations without any brand. `checked: true` means: no real construction company, builders'
# merchant, window or joinery maker, electrical contractor or building-product brand uses the
# distinctive part of an organisation name; no commune, locality or street has a place name (the
# town is invented, so its generic street names match no real address); no public figure and no
# construction professional has a person's full name; no real product uses an article code.
# Common French surnames are shared by many private people; full names were checked against
# public figures. `check_note` records what was searched and found. Rejected candidates are not
# named here.
#
# Identifiers: no company registration, tax, bank or phone number and no postal code is ever
# printed. E-mail addresses use only the reserved `.example` domains listed below.
#
# samples/fiction/allowlist.txt is generated from this file:
#   uv run python samples/generators/allowlist.py

schema: 1

world:
  name: Chantier Moreau
  summary: >-
    Lamna Bâtiment, a small general contractor of the invented town of Valbrise, builds a 30 m²
    single-storey extension at the back of the house of Séverine and Aymeric Moreau and renovates
    their kitchen. Zava Matériaux supplies the materials, VanArsdel Menuiseries makes the windows
    and Adatum Électricité does the electrical work as a subcontractor. The corpus follows the
    job from the first quote (January 2026) to the works in progress (end of March 2026).
  pack: batiment
  stamp: FICTIONAL - NOT FOR OPERATIONAL USE
  stamp_variants:
    - FICTIONAL - NOT FOR OPERATIONAL USE
    - "FICTIONAL — NOT FOR OPERATIONAL USE"
  timeline_start: "2026-01-01"
  timeline_end: "2026-04-30"
  timezone_note: >-
    Local times are written without offset; e-mail headers use +0100 (winter time, until
    2026-03-28) or +0200 (summer time, from 2026-03-29).
  currency: EUR
  languages:
    documents: fr
    wiki: en
  print_formats:
    amounts: >-
      Amounts are stored in this file as numbers in euros and printed with two decimals, a comma
      as decimal separator, NO thousands separator and a space before the euro sign, for example
      12500,00 € (the engine joins digit groups only across non-breaking spaces).
    quantities: Comma decimal separator (16,80 ml; 30,00 m²); dimensions with a lower-case x (3,00 x 2,15 m).
    dates: >-
      Dates are stored in ISO form and printed JJ/MM/AAAA in the documents (17/03/2026);
      prose may also write the day and month name in French (lundi 20 avril 2026).
    percentages: A space before the percent sign (30 %).
  generator:
    author: DocWiki sample generator
    last_modified_by: DocWiki sample generator
    seed: 20260917
  email_domains:
    note: >-
      All e-mail addresses use the reserved `.example` top-level domain (RFC 2606) and are not
      routable. No other e-mail domain is used in the samples.
    domains:
      - lamna-batiment.example
      - famille-moreau.example
      - zava-materiaux.example
      - vanarsdel-menuiseries.example
      - adatum-electricite.example

