    note: >-
      Fictional sample rates that mimic usual French rates; not tax guidance. 20 % applies to the
      extension (lots 1 to 7 and amendment n°1), 10 % to the kitchen renovation (lot 8).
    rate_extension: 20
    rate_kitchen: 10
  site:
    address: "12 chemin des Vergers, Valbrise"
    extension: {floor_area_m2: 30.00, interior: "6,00 x 5,00 m", roof: "charpente bois monopente, tuiles", opening_to_house: "baie de liaison de 2,40 m dans le mur du séjour"}
    builder_address: "4 rue des Artisans, Valbrise"
    merchant_address: "agence de Valbrise, zone d'activités des Sablières"
