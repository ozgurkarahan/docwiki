# Document numbers (emitted as `re:` lines in allowlist.txt). Only the quote (DEV) and the
# planning (PLN) carry revisions ("indice A", "indice B"), and only their file names start with
# their number; no other file name, and no document's extracted text, starts with DEV- or PLN-.
document_number_schemes:
  - {prefix: "DEV-", pattern: "DEV-<AAAA>-<NNN> indice <A-H>", regex: 'DEV-\d{4}-\d{3}', owner: lamna-batiment, meaning: quote (devis), examples: [DEV-2026-014]}
  - {prefix: "PLN-", pattern: "PLN-<AAAA>-<NNN> indice <A-H>", regex: 'PLN-\d{4}-\d{3}', owner: lamna-batiment, meaning: schedule and purchase tracking workbook (planning), examples: [PLN-2026-003]}
  - {prefix: "BC-", pattern: "BC-<AAAA>-<NNN>", regex: 'BC-\d{4}-\d{3}', owner: lamna-batiment, meaning: "purchase or subcontract order (bon de commande); numbered company-wide, so numbers of one job are not contiguous", examples: [BC-2026-008, BC-2026-009, BC-2026-010, BC-2026-012, BC-2026-013, BC-2026-016]}
  - {prefix: "FA-", pattern: "FA-<AAAA>-<NNNN>", regex: 'FA-\d{4}-\d{4}', owner: zava-materiaux, meaning: invoice (facture), examples: [FA-2026-0217, FA-2026-0174]}
  - {prefix: "BL-", pattern: "BL-<AAAA>-<NNNN>", regex: 'BL-\d{4}-\d{4}', owner: zava-materiaux, meaning: delivery note (bon de livraison), examples: [BL-2026-0391]}

# Identifier patterns of articles, building elements, planning tasks and payments (emitted as
# `re:` lines in allowlist.txt).
identifier_patterns:
  - {name: Zava article code, regex: 'ZM-\d{5}', examples: [ZM-20450, ZM-31020, ZM-44108, ZM-27340, ZM-61078]}
  - {name: window or opening mark, regex: 'FT?\d', examples: [F1, F2, F3, FT1]}
  - {name: planning task, regex: 'T\d{2}', examples: [T01, T07, T18]}
  - {name: bank transfer reference, regex: 'VIR-\d{5}', examples: [VIR-58213]}

