# Document numbers (emitted as `re:` lines in allowlist.txt). Only the quotes and DPGF (DEV) and
# the plannings (PLN) carry revisions ("indice A", "indice B"), and only their file names start
# with their number; no other file name, and no document's extracted text, starts with DEV- or
# PLN-. DEV and PLN numbers are company-wide series: a number belongs to one chantier only
# (DEV-2026-014 and PLN-2026-003 to Moreau, DEV-2026-031 and PLN-2026-007 to the school).
document_number_schemes:
  - {prefix: "DEV-", pattern: "DEV-<AAAA>-<NNN> indice <A-H>", regex: 'DEV-\d{4}-\d{3}', owner: lamna-batiment, meaning: "quote (devis), or the DPGF of a public tender, numbered in the same company-wide series", examples: [DEV-2026-014, DEV-2026-031]}
  - {prefix: "PLN-", pattern: "PLN-<AAAA>-<NNN> indice <A-H>", regex: 'PLN-\d{4}-\d{3}', owner: lamna-batiment, meaning: schedule workbook (planning) of a chantier, examples: [PLN-2026-003, PLN-2026-007]}
  - {prefix: "BC-", pattern: "BC-<AAAA>-<NNN>", regex: 'BC-\d{4}-\d{3}', owner: lamna-batiment, meaning: "purchase or subcontract order (bon de commande); numbered company-wide, so numbers of one job are not contiguous", examples: [BC-2026-004, BC-2026-005, BC-2026-008, BC-2026-009, BC-2026-010, BC-2026-012, BC-2026-013, BC-2026-016, BC-2026-021]}
  - {prefix: "FA-", pattern: "FA-<AAAA>-<NNNN>", regex: 'FA-\d{4}-\d{4}', owner: zava-materiaux, meaning: invoice (facture), examples: [FA-2026-0158, FA-2026-0174, FA-2026-0217]}
  - {prefix: "BL-", pattern: "BL-<AAAA>-<NNNN>", regex: 'BL-\d{4}-\d{4}', owner: zava-materiaux, meaning: delivery note (bon de livraison), examples: [BL-2026-0244, BL-2026-0391]}
  - {prefix: "FC-", pattern: "FC-<AAAA>-<NNN>", regex: 'FC-\d{4}-\d{3}', owner: lamna-batiment, meaning: "client invoice of Lamna Bâtiment (acompte, situation), numbered per year and company-wide", examples: [FC-2025-118, FC-2026-004, FC-2026-009, FC-2026-013, FC-2026-022]}

# Identifier patterns of articles, building elements, planning tasks, réserves, equipment and
# payments (emitted as `re:` lines in allowlist.txt).
identifier_patterns:
  - {name: Zava article code, regex: 'ZM-\d{5}', examples: [ZM-20450, ZM-31020, ZM-44108, ZM-27340, ZM-61078, ZM-52140, ZM-52610, ZM-52730, ZM-52815, ZM-53220, ZM-53410, ZM-55120, ZM-55310]}
  - {name: window or opening mark (Moreau), regex: 'FT?\d', examples: [F1, F2, F3, FT1]}
  - {name: stairwell window mark (résidence Les Nacrines), regex: 'C\d{1,2}', examples: [C1, C12]}
  - {name: school window mark (école du Bourg), regex: 'E\d{1,2}', examples: [E1, E16]}
  - {name: planning task, regex: 'T\d{2}', examples: [T01, T07, T18]}
  - {name: réserve number, regex: 'R\d{2}', examples: [R01, R07]}
  - {name: equipment code, regex: 'MAT-\d{2}', examples: [MAT-01, MAT-04, MAT-08]}
  - {name: bank transfer reference, regex: 'VIR-\d{5}', examples: [VIR-58213]}

