      - "Durée prévisionnelle des travaux : 12 semaines."
      - "TVA à 20 % sur les lots 1 à 7 (agrandissement) et à 10 % sur le lot 8 (rénovation de la cuisine)."
    signature_box: "Bon pour accord (date et signature du client)"
