# DocWiki sample world bible - the CLOSED WORLD for every sample document, test and domain pack.
#
# Everything in this file is FICTIONAL. Organisations, people, places, products, article codes,
# document numbers, events and amounts are invented for the DocWiki sample corpus (domain pack
# `batiment`): a small general contractor of an invented French town runs three chantiers at
# three phases and under three contract types (a private household's extension in execution, a
# copropriété's façade refurbishment at réception, a public school renovation in preparation)
# and keeps company-wide documents (framework contract, price list, registers, general terms),
# from late 2025 to April 2026. The documents are written in French.
# Content license: CC BY 4.0 (see LICENSE-CONTENT.md).
#
# Holdout authors: do NOT read the `timeline`, `facts`, `scenarios` and `injection` sections of
# this file, nor samples/fiction/PLANTED.md. They describe the planted answers of the evaluation
# corpus.
#
# Name checks: every organisation, place and person name below, and every article code, was
# web-searched on 2026-10-19 (the Moreau world) or on 2026-10-23 (the names added for slice F:
# the copropriété, the school, the new staff and partners), through the agent web-search tool;
# products are generic French
# designations without any brand. `checked: true` means: no real construction company, builders'
# merchant, window or joinery maker, electrical contractor or building-product brand uses the
# distinctive part of an organisation name; no commune, locality or street has a place name (the
# town is invented, so its generic street names match no real address); no public figure and no
# construction professional has a person's full name; no real product uses an article code.
# Common French surnames are shared by many private people; full names were checked against
# public figures. `check_note` records what was searched and found. Rejected candidates are not
# named here.
#
# Identifiers: no real company registration, tax, bank or phone number and no postal code is
# ever printed. The legal identity line of invoices, quotes, contracts and orders uses one
# obviously fictional all-zero format (world.legal_identity) marked "identifiants fictifs"; the
# only phone numbers are the public emergency numbers 15, 18 and 112 of the PPSPS. E-mail
# addresses use only the reserved `.example` domains listed below.
#
# samples/fiction/allowlist.txt is generated from this file:
#   uv run python samples/generators/allowlist.py

schema: 1

world:
  name: Lamna Bâtiment
  summary: >-
    Lamna Bâtiment, a small general contractor of the invented town of Valbrise, runs three
    chantiers. Chantier Moreau (private household, in execution): a 30 m² single-storey extension
    at the back of the house of Séverine and Aymeric Moreau and the renovation of their kitchen.
    Chantier résidence Les Nacrines (copropriété, at réception): façade refurbishment with
    external thermal insulation and new aluminium windows and doors in the common parts, with
    Atelier Fabrikam as maître d'œuvre and Proseware Gestion as syndic. Chantier école de
    Montferrine (public contract of the invented commune of Montferrine, in preparation): the
    energy renovation of the école élémentaire du Bourg during the 2026 summer holidays. Zava
    Matériaux supplies the materials under a 2026 framework contract, VanArsdel Menuiseries makes
    the windows and doors of all three chantiers, Adatum Électricité and Litware Plomberie are
    subcontractors. Company documents hold the framework contract and price list, the crew
    schedule, the equipment and subcontractor-attestation registers, the billing register, the
    general terms, the organisation chart and a restricted margin dashboard.
  pack: batiment
  stamp: FICTIONAL - NOT FOR OPERATIONAL USE
  stamp_variants:
    - FICTIONAL - NOT FOR OPERATIONAL USE
    - "FICTIONAL — NOT FOR OPERATIONAL USE"
  timeline_start: "2025-09-01"
  timeline_end: "2026-04-30"
  timezone_note: >-
    Local times are written without offset; e-mail headers use +0100 (winter time, until
    2026-03-28) or +0200 (summer time, from 2026-03-29).
  currency: EUR
  legal_identity: "SIRET 000 000 000 00000 - RCS 000 000 000 - TVA FR00000000000 (identifiants fictifs)"
  languages:
    documents: fr
    wiki: en
  print_formats:
    amounts: >-
      Amounts are stored in this file as numbers in euros and printed with two decimals, a comma
      as decimal separator, NO thousands separator and a space before the euro sign, for example
      12500,00 € (the engine joins digit groups only across non-breaking spaces).
    quantities: Comma decimal separator (16,80 ml; 30,00 m²); dimensions with a lower-case x (3,00 x 2,15 m).
    dates: >-
      Dates are stored in ISO form and printed JJ/MM/AAAA in the documents (17/03/2026);
      prose may also write the day and month name in French (lundi 20 avril 2026).
    percentages: A space before the percent sign (30 %).
  generator:
    author: DocWiki sample generator
    last_modified_by: DocWiki sample generator
    seed: 20260917
  email_domains:
    note: >-
      All e-mail addresses use the reserved `.example` top-level domain (RFC 2606) and are not
      routable. No other e-mail domain is used in the samples.
    domains:
      - lamna-batiment.example
      - famille-moreau.example
      - zava-materiaux.example
      - vanarsdel-menuiseries.example
      - adatum-electricite.example
      - proseware-gestion.example
      - atelier-fabrikam.example
      - mairie-montferrine.example
      - trey-prevention.example

