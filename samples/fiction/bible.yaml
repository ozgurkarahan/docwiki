    note: >-
      Abstain fact: no document mentions an architect or any design professional. These words
      must not appear in any corpus document (the contract calls the parties "le Client" and
      "l'Entreprise").
    terms: [architecte, architect, "maître d'œuvre", "maîtrise d'œuvre", "bureau d'études", "maître d'ouvrage"]

  devis:
    number: DEV-2026-014
    object: "Extension de plain-pied de 30 m² et rénovation de la cuisine"
    issuer: bertrand-sauzede
    reference_sentence: "Suite à notre visite technique du 13/01/2026, nous vous prions de trouver ci-dessous notre proposition."
