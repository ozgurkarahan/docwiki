# Compile fidelity: what the compiled wiki must say, taken from the fictional world's ground truth
# (samples/fiction/bible.yaml, `facts` and the planted `scenarios` S1-S20), never from a compiled
# wiki. Read by evals/compile_fidelity.py, which checks a release folder without any model call.
# Only values printed in a public document are expected (amounts derived by the bible, such as a
# release date one year after a réception, are not); tests/samples/test_compile_fidelity_spec.py
# checks it. A value marked `ocr` is handwriting on an image-only scan.
#
# FICTIONAL - every name, amount and date below is invented (samples/fiction/bible.yaml).
#
# Kinds of checks:
#   revisions - a source page's `status` and `superseded_by` (by source path, relative to the
#               corpus root `samples/corpus/full`).
#   facts     - every value appears in one section of one topic or view page of `scope`
#               ("synthesised"; scope `entreprise` also takes the company-wide pages without a
#               scope); also reported: in one section of any French page ("compiled").
#   cross     - every value appears in one section of one topic or view page, any scope: the
#               cross-chantier syntheses of slice F.
#   scope_absent - none of the terms appears on a page of `scope` (abstain facts).
# The forbidden strings (restricted-only values, injection canary and transfer reference) are read
# from the bible itself; the document stamp is counted where it is read as content.
