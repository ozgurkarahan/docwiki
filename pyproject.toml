[project]
name = "docwiki"
version = "0.1.0"
description = "Turn messy documents into a wiki humans can browse and agents can trust - cited to the page."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ozgur Karahan" }]
keywords = ["llm-wiki", "knowledge-base", "agents", "mcp", "agent-skills", "azure", "foundry"]
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "httpx>=0.27",
  "duckdb>=1.1",
]

[project.optional-dependencies]
extract = [
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pillow>=10.4",
]
azure = [
  "azure-identity>=1.17",
  "azure-storage-blob>=12.20",
  "azure-storage-queue>=12.10",
  "azure-ai-projects>=2.0",
  "openai>=1.60",
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-sdk>=1.25",
  "aiohttp>=3.9",
]
mcp = [
  "mcp>=2.3,<3",
  "duckdb>=1.1",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "PyJWT[crypto]>=2.8",
]
workflow = [
  "agent-framework-core>=1.0",
]
portal = [
  "starlette>=0.37",
  "uvicorn>=0.30",
]
evals = [
  "azure-ai-evaluation>=1.0",
]
gen = [
  "fpdf2>=2.7",
  "matplotlib>=3.9",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pillow>=10.4",
]

[project.scripts]
docwiki = "docwiki.cli:app"
docwiki-mcp = "docwiki.mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docwiki"]

[tool.uv]
constraint-dependencies = [
  "cryptography==46.0.3 ; sys_platform == 'win32' and platform_machine == 'ARM64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["samples/corpus", "samples/wiki", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: requires Azure resources (excluded by default)"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
