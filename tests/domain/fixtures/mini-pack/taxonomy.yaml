categories:
  - key: procedures
    title: Procedures
    description: Standard operating procedures and work instructions.
  - key: oem-documentation
    title: OEM documentation
  - key: records
    title: Records and data
doc_types:
  - key: sop
    title: Standard operating procedure
    category: procedures
    authority: 7
    rules:
      - filename_regex: "(?i)^sop[-_ ]"
      - text_regex: "(?i)standard operating procedure"
        first_chars: 200
  - key: service-bulletin
    title: Service bulletin
    category: oem-documentation
    authority: 9
    rules:
      - filename_regex: "(?i)bulletin"
        text_regex: "(?i)litware"
  - key: maintenance-plan
    title: Maintenance plan
    category: records
    authority: 5
    rules:
      - filename_regex: "(?i)plan.*\\.xlsx$"
