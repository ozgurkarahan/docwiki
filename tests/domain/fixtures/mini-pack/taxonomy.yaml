categories:
  - key: quotes
    title: Quotes
    description: Quotes and their revisions.
  - key: purchasing
    title: Purchasing
  - key: records
    title: Records and data
doc_types:
  - key: devis
    title: Quote (devis)
    category: quotes
    authority: 7
    rules:
      - filename_regex: "(?i)^dev[-_ ]"
      - text_regex: "(?i)devis de travaux"
        first_chars: 200
  - key: facture
    title: Supplier invoice (facture)
    category: purchasing
    authority: 9
    rules:
      - filename_regex: "(?i)facture"
        text_regex: "(?i)zava"
  - key: etude-de-prix
    title: Internal price study
    category: records
    authority: 5
    rules:
      - filename_regex: "(?i)etude.*\\.xlsx$"
