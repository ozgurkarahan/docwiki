name: pages

# Builds the public sample site (site.md §4) from the committed sample wiki (a portable wiki
# folder: wiki at the root, evidence/ inside, machine files under .docwiki/) with the pinned Quartz
# (site/QUARTZ_VERSION) and the DocWiki overlay, checks it, then deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "samples/wiki/**"
      - "site/**"
      - "src/docwiki/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Wiki to publish (the mock release fixture is useful to test the pipeline)"
        type: choice
        options:
          - samples/wiki
          - samples/fixtures/mock-release
        default: samples/wiki

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_HOST: docwiki.ozgurkarahan.com

jobs:
  build:
    name: build and check the site
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.release.outputs.present }}
    steps:
      - uses: actions/checkout@v7

      - name: Locate the sample wiki
        id: release
        env:
          RELEASE: ${{ inputs.release || 'samples/wiki' }}
        run: |
          if [ -f "$RELEASE/.docwiki/manifest.json" ] || [ -f "$RELEASE/.docwiki/current.json" ]; then
            layout="portable wiki"
          elif [ -f "$RELEASE/releases/current.json" ] || [ -f "$RELEASE/current.json" ] \
            || [ -f "$RELEASE/wiki/index.md" ]; then
            layout="release"
          else
            echo "::notice title=pages::No sample wiki in $RELEASE yet; nothing to publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Publishing the $layout in $RELEASE"
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "path=$RELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.release.outputs.present == 'true'
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.present == 'true'
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Restore the Quartz checkout
        if: steps.release.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/quartz
          key: quartz-${{ runner.os }}-${{ hashFiles('site/QUARTZ_VERSION') }}

      - name: Install DocWiki
        if: steps.release.outputs.present == 'true'
        run: uv sync

      - name: Build the site
        if: steps.release.outputs.present == 'true'
        env:
          RELEASE_PATH: ${{ steps.release.outputs.path }}
        run: uv run python -m docwiki.site "$RELEASE_PATH" --out public --base-url "$SITE_HOST" --no-check

      - name: Check links and anchors
        if: steps.release.outputs.present == 'true'
        run: uv run python -m docwiki.site.links public

      - name: Security scan
        if: steps.release.outputs.present == 'true'
        run: uv run python -m docwiki.site.scan public --base-url "$SITE_HOST"

      - name: Custom domain
        if: steps.release.outputs.present == 'true'
        # Pages deployments from Actions take the domain from the repository settings; the
        # CNAME file documents it in the published output.
        run: echo "$SITE_HOST" > public/CNAME

      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.present == 'true'
        with:
          path: public

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # Only the public repository publishes the site; other copies (forks, the private development
    # repository) still build and check it.
    if: needs.build.outputs.present == 'true' && github.repository == 'ozgurkarahan/docwiki'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
